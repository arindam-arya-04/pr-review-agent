services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: pr_review_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pr_review_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/pr_review_agent
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-mysecret123}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-4507518}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-152282333}
      GITHUB_PRIVATE_KEY_PATH: /run/secrets/github-private-key-pkcs8.pem
    volumes:
      - ./secrets/github-private-key-pkcs8.pem:/run/secrets/github-private-key-pkcs8.pem:ro

volumes:
  pgdata:
